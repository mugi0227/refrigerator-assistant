name: Integrated Gemma iOS
on:
  push:
    branches: [codex/gemma-reference-probe]
    paths: ['ios/**', 'public/**', 'scripts/**', '.github/workflows/gemma-probe.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: gemma-probe-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Record build environment
        run: |
          uname -m
          xcodebuild -version
          xcrun simctl list runtimes
      - name: Build integrated device app
        run: bash scripts/build-ios.sh 2>&1 | tee device-build.log
      - name: Test integrated Gemma and camera OCR on real runtime
        id: runtime
        timeout-minutes: 8
        run: bash scripts/test-ios-runtime.sh -skip-testing:FridgeRuntimeTests/ReferenceProbeTests -test-timeouts-enabled YES -default-test-execution-time-allowance 240 -maximum-test-execution-time-allowance 240 2>&1 | tee runtime-test.log
      - name: Verify normal launch and inventory persistence
        run: bash scripts/test-ios.sh 2>&1 | tee simulator-test.log
      - name: Save verified integrated IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fridge-AltStore
          path: ios/build/ipa/Fridge-unsigned.ipa
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fridge-iOS-diagnostics
          path: |
            device-build.log
            runtime-test.log
            simulator-test.log
            ios/build-runtime/summary.json
            ios/build-runtime/attachments
            ios/build-runtime/probe-logs
            ios/build-simulator/summary.json
            ios/build-simulator/screenshots
          retention-days: 7
