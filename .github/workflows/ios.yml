name: iOS AltStore build
on:
  push:
    branches: [codex/ios-altstore]
    paths: ['ios/**', 'public/**', 'scripts/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      quick_device:
        description: 'Build and validate IPA for immediate physical-device testing; skip Simulator and model suites'
        type: boolean
        default: false
      camera_only:
        description: 'Run camera, OCR, inventory and UI regression tests (AI code unchanged)'
        type: boolean
        default: false
      gemma_smoke:
        description: 'Check E2B images, food/expiry JSON prompts, parser cases and engine reuse; skip complete model/UI suites'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fridge-ios-${{ github.ref }}-${{ inputs.camera_only && 'camera' || 'full' }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Prepare optional private label regression fixture
        if: ${{ !inputs.quick_device }}
        env:
          FRIDGE_PRIVATE_LABEL: ${{ secrets.FRIDGE_OCR_FIXTURE_20261009 }}
        run: |
          python3 - <<'PY'
          import os,base64
          from pathlib import Path
          if value := os.environ.get('FRIDGE_PRIVATE_LABEL'):
              Path('ios/FridgeRuntimeTests/Fixtures/private-expiry.jpg').write_bytes(base64.b64decode(value))
          PY
      - name: Build unsigned iPhone IPA
        id: device
        run: bash scripts/build-ios.sh 2>&1 | tee device-build.log
      - name: Check native runtime regression tests
        if: ${{ !inputs.quick_device && !cancelled() && steps.device.outcome == 'success' }}
        env:
          FRIDGE_CAMERA_ONLY: ${{ inputs.camera_only && '1' || '0' }}
          FRIDGE_GEMMA_SMOKE: ${{ inputs.gemma_smoke && '1' || '0' }}
        run: bash scripts/test-ios-runtime.sh 2>&1 | tee runtime-test.log
      - name: Check inventory persistence on iOS Simulator
        if: ${{ !inputs.quick_device && !inputs.gemma_smoke }}
        run: bash scripts/test-ios.sh 2>&1 | tee simulator-test.log
      - name: Save AltStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fridge-AltStore
          path: ios/build/ipa/Fridge-unsigned.ipa
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Fridge-iOS-diagnostics
          path: |
            device-build.log
            runtime-test.log
            ios/build-runtime/Runtime.xcresult
            ios/build-runtime/Reference.xcresult
            ios/build-runtime/*-summary.json
            ios/build-runtime/*-attachments
            ios/build-runtime/native-logs
            ios/build-runtime/probe-logs
            simulator-test.log
            ios/build-simulator/UI.xcresult
            ios/build-simulator/app-info.plist
            ios/build-simulator/summary.json
            ios/build-simulator/screenshots
          retention-days: 1
      - name: Save compact visual evidence
        if: ${{ !inputs.quick_device && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: Fridge-visual-evidence
          path: |
            ios/build-simulator/screenshots
            ios/build-simulator/summary.json
            ios/build-runtime/*-summary.json
            ios/build-runtime/Runtime-attachments/*.png
            ios/build-runtime/Runtime-attachments/manifest.json
          retention-days: 1
