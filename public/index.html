<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f2"><meta name="description" content="冷蔵庫の食品の個数と期限を管理するアプリ。バーコードと期限の印字を端末内で読み取ります。">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="冷蔵庫の相棒">
  <link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="manifest" href="./manifest.webmanifest"><link rel="stylesheet" href="./styles.css">
  <title>冷蔵庫の相棒 · fridge.</title>
</head>
<body>
  <div class="app-shell">
    <main id="main">
      <section id="view-home" class="view"></section>
      <section id="view-scan" class="view" hidden>
        <div class="page-head"><h1>スキャン</h1><button class="small-button" data-action="manual">手入力</button></div>
        <div class="scan-toolbar"><div class="segmented"><button class="active" id="mode-add" data-action="mode" data-mode="add">登録</button><button id="mode-consume" data-action="mode" data-mode="consume">消費</button></div><label class="sr-only" for="scan-location">保存場所</label><select id="scan-location"><option value="fridge">冷蔵</option><option value="freezer">冷凍</option><option value="pantry">常温</option></select></div>
        <div id="demo-banner" class="notice amber" hidden>デモ：実物は認識せず、在庫にも保存しません。</div>
        <div class="camera-stage" id="camera-stage"><video id="camera" playsinline muted autoplay></video>
          <div class="camera-idle" id="camera-idle"><div class="viewfinder-icon" aria-hidden="true">📷</div><p>バーコード → 期限の印字の順に映すと、<br>5秒後に自動で登録します。</p><button class="primary light" data-action="camera-start">カメラを起動</button><button class="text-button on-dark" data-action="demo-start">操作デモ</button></div>
          <div class="scan-frame" id="scan-frame" hidden><span></span><span></span><span></span><span></span></div>
          <div class="camera-top"><span id="camera-status">カメラ停止中</span><button class="glass-button" id="camera-stop" data-action="camera-stop" hidden>終了</button></div>
          <div class="scan-subtitle" id="scan-subtitle" hidden>枠の中に、食品を1種類ずつ</div>
          <div class="scan-result" id="scan-result" role="status" aria-live="polite" hidden></div>
        </div>
        <div class="scan-foot"><span id="metric">Gemma未起動</span><button class="text-button" id="pause-scan" data-action="pause" hidden>一時停止</button></div>
        <div class="demo-controls" id="demo-controls" hidden><button data-action="demo-milk">牛乳を映す</button><button data-action="demo-date">期限を映す</button><button data-action="demo-tomato">トマトを映す</button><button data-action="demo-empty">枠から外す</button></div>
        <details class="diagnostics"><summary>読み取りの詳細</summary><pre id="raw-output">まだ読み取りはありません。</pre></details>
      </section>
      <section id="view-recipes" class="view" hidden></section>
      <section id="view-shopping" class="view" hidden></section>
      <section id="view-settings" class="view" hidden></section>
    </main>
    <nav class="bottom-nav" aria-label="メインメニュー">
      <button data-action="view" data-view="home" class="active" aria-label="冷蔵庫"><span aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="2.5"/><path d="M5 9.5h14M8.5 5.5v2M8.5 12.5v3"/></svg></span>冷蔵庫</button>
      <button data-action="view" data-view="shopping" aria-label="買い物"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 10.5h10.3L19.5 7H6.3"/><circle cx="9" cy="19" r="1.4"/><circle cx="17" cy="19" r="1.4"/></svg></span>買い物</button>
      <button data-action="view" data-view="scan" class="scan-nav" aria-label="スキャン"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16M8 8v8M11 8v8M14 8v8M17 8v8"/></svg></span>スキャン</button>
      <button data-action="view" data-view="recipes" aria-label="献立"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 10h16v5a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM2 10h2M20 10h2M9 7c0-1.5 1-1.5 1-3M14 7c0-1.5 1-1.5 1-3"/></svg></span>献立</button>
      <button data-action="view" data-view="settings" aria-label="設定"><span aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></span>設定</button>
    </nav>
  </div>
  <dialog id="editor" class="sheet" aria-labelledby="editor-title"><form id="editor-form"></form></dialog>
  <dialog id="item-sheet" class="sheet" aria-labelledby="item-title"><div id="item-detail"></div></dialog>
  <dialog id="staple-editor" class="sheet" aria-labelledby="staple-title"><form id="staple-form"><div class="dialog-heading"><h2 id="staple-title">常備品</h2><button type="button" class="icon-button" data-action="close-staple" aria-label="閉じる">×</button></div><label>食品名<input name="name" required maxlength="80" placeholder="例：卵"></label><div class="form-row"><label>この数量を下回ったら補充<input name="minimum" type="number" min="0.1" step="0.1" value="3" required></label><label>補充後の目標数量<input name="target" type="number" min="0.1" step="0.1" value="10" required></label></div><label>単位<select name="unit"><option>個</option><option>本</option><option>パック</option><option>束</option><option>袋</option><option>g</option><option>ml</option></select></label><p class="form-error" id="staple-error" role="alert"></p><button class="primary" type="submit">常備品に追加</button></form></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="backup-file" accept="application/json,.json" hidden>
  <input type="file" id="model-file" accept=".litertlm" hidden>
  <noscript>このアプリはJavaScriptを有効にすると利用できます。</noscript>
  <script type="module" src="./app.js"></script>
</body></html>
